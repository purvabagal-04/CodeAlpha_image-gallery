<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>My Image Gallery</h1>

    
    <div class="filters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="nature">Nature</button>
        <button class="filter-btn" data-category="city">City</button>
        <button class="filter-btn" data-category="animals">Animals</button>
    </div>

    
    <div class="gallery">

        <div class="gallery-item" data-category="nature">
            <img src="./images/img1.jpg" alt="Nature">
        </div>

        <div class="gallery-item" data-category="nature">
            <img src="./images/img3.jpg" alt="Nature">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/img4.jpg" alt="Dog">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/img5.jpg" alt="Anmimal">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/img6.avif" alt="City">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/img7.jpg" alt="City">
        </div>

        <div class="gallery-item" data-category="city">
            <img src="./images/img9.jpg" alt="City">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/img8.jpg" alt="Animal">
        </div>

        <div class="gallery-item" data-category="animals">
            <img src="./images/img10.webp" alt="Animal">
        </div>

    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="Large Image">

        <button class="next" id="next">&#10095;</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
